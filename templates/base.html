  <!-------------------------------------------------------------------
    ---------------------------------------------------------------------
    -------------------------------------------------------------------->

  <!-- Website CSS -->
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet" />

  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet" />

  <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet" />

  <!-------------------------------------------------------------------
    ---------------------------------------------------------------------
    -------------------------------------------------------------------->

  <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/scrollreveal"></script>
</head>

<body>
  {% block content %}

  {% endblock %}

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script src="{{ url_for('static', filename='js/index.js') }}"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script>
    ScrollReveal({
      reset: true,
      distance: "200px",
      duration: 1500,
      delay: 600,
    });

    ScrollReveal().reveal(".reveal__left", { delay: 200, origin: "left" });
    ScrollReveal().reveal(".reveal__right", {
      delay: 200,
      origin: "right",
    });

    ScrollReveal().reveal(".reveal__top", { delay: 200, origin: "top" });
    ScrollReveal().reveal(".reveal__bottom", {
      delay: 200,
      origin: "bottom",
    });

    // Text Animation Section //

    ScrollReveal().reveal(".reveal__top", { 
      delay: 500, 
      origin: "top" 
    });

    ScrollReveal().reveal(".reveal__bottom", {
      delay: 500,
      origin: "bottom",
    });

    ScrollReveal().reveal(".reveal__left", { 
      delay: 500, 
      origin: "left" 
    });

    ScrollReveal().reveal(".reveal__right", {
      delay: 500,
      origin: "right",
    });

    ScrollReveal().reveal(".reveal__interval__top", {
      delay: 400,
      origin: "top",
      interval: 200,
    });

    ScrollReveal().reveal(".reveal__interval__left", {
      delay: 400,
      origin: "left",
      interval: 200,
    });

    ScrollReveal().reveal(".reveal__interval__right", {
      delay: 400,
      origin: "right",
      interval: 200,
    });

    ScrollReveal().reveal(".reveal__interval__bottom", {
      delay: 400,
      origin: "bottom",
      interval: 200,
    });

    ScrollReveal().reveal(".reveal__text", {
      delay: 1000,
      origin: "left",
    });
    
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", scrollShadow);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", ImageSwiper);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", OpenMenu);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", notificationClose);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", TitleCount);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", popupClose);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", OpenResponsiveMenu);
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", OpendashboardResponsivenessMenu);
  </script>
  
</body>

</html>
